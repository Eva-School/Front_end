name: Frontend CI / CD

# ────────────────────────────────────────────────────────────────────────────
# Trigger on every push / PR to the dev branch.
# Deploy step only runs on direct pushes (not PRs) to keep secrets safe.
# ────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  # ── 1. Continuous Integration ────────────────────────────────────────────────
  ci:
    name: 🔍 Type-check, Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      # Provide a placeholder so next.config.ts doesn't throw during CI build.
      # The real value is injected at deploy time.
      BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ── 2. Continuous Deployment → Vercel ────────────────────────────────────────
  # Uses the official Vercel CLI via npx.
  #
  # Required GitHub Secrets:
  #   VERCEL_TOKEN       – from vercel.com → Account Settings → Tokens
  #   VERCEL_ORG_ID      – from .vercel/project.json (after `vercel link`)
  #   VERCEL_PROJECT_ID  – from .vercel/project.json (after `vercel link`)
  #   BACKEND_API_URL    – e.g. https://grade-management-api.onrender.com/api
  deploy:
    name: 🚀 Deploy to Vercel
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    env:
      VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pull Vercel project settings & linked env vars
      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Build with production env vars injected
      - name: Build for production
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}

      # Ship the pre-built output to Vercel CDN
      - name: Deploy to Vercel
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
