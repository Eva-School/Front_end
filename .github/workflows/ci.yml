name: Frontend CI / CD

# ────────────────────────────────────────────────────────────────────────────
# Trigger on every push / PR to the dev branch.
# Deploy step only runs on direct pushes (not PRs) to keep secrets safe.
# ────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  # ── 1. Continuous Integration ────────────────────────────────────────────────
  ci:
    name: 🔍 Type-check, Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    env:
      # Provide a placeholder so next.config.ts doesn't throw during CI build.
      # The real value is injected at deploy time.
      BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
